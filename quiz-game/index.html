<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubulle Quiz Game</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <div class="screen active" id="start-screen">
            <h1>Bubulle Quiz Time !</h1>
            <p>Teste tes connaissance sur Bubulle</p>
            <button id="start-btn">Zé parti !</button>
        </div>

        <div class="screen" id="quiz-screen">
            <div class="quiz-header">
                <h2 id="question-text">Question</h2>
                <div class="quiz-info">
                    <p>
                        Question <span id="current-question">1</span> of <span id="total-questions">5</span>
                    </p>
                    <p>
                        Score : <span id="score">0</span>
                    </p>
                </div>
            </div>

            <div id="answers-container" class="answers-container">
                <!-- future boutons avec js -->
            </div>

            <div class="progress-bar">
                <div id="progress" class="progress"></div>
            </div>
        </div>

        <div id="result-screen" class="screen">
            <h1>Quiz Results</h1>
            <div class="result-info">
                <p>Ton score <span id="final-score">0</span> sur <span id="max-score">5</span></p>
            
                <div id="result-message">Bien joué !</div>
            </div>

            <button id="restart-btn">On recommence ?</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
